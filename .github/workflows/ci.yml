name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check types and Svelte
        run: bun run check

      # Integration tests create in-memory local D1 databases and apply drizzle/ themselves.
      - name: Run unit and integration tests
        run: bun run test

      - name: Build production app
        run: bun run build

      # Bundles the Worker exactly as `wrangler deploy` would, without credentials or uploading.
      - name: Validate Worker bundle
        run: bunx wrangler deploy --dry-run --outdir dist-worker
